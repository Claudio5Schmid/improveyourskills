# Netlify build configuration.
#
# Netlify auto-detects Next.js and applies its Next runtime (@netlify/plugin-nextjs),
# which handles the App Router, middleware and the .next output — so no publish
# directory or plugin needs to be listed here. Security headers (CSP, HSTS, …)
# are added in Phase 7 once Supabase / Turnstile / Cloudflare origins are known.

[build]
  command = "npm run build"

[build.environment]
  # Pin the Node version Netlify builds with (local dev uses 24; 22 LTS is the
  # safe, widely-available image on Netlify and runs Next 15 + React 19 fine).
  NODE_VERSION = "22"
